<!DOCTYPE html>
<html>
<head>
<title>Lavanderia Compartilhada</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#f2f2f2;
}

.caixa{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

</style>

</head>

<body>

<h1>Lavanderia Compartilhada</h1>

<div class="caixa">

<h2>Lavadora 1</h2>

<p id="maq1">🟢 Livre</p>

<button onclick="lavando()">Começar lavagem</button>

<button onclick="livre()">Terminou</button>

</div>

<script>

function lavando(){
document.getElementById("maq1").innerHTML="🔴 Lavando";
}

function livre(){
document.getElementById("maq1").innerHTML="🟢 Livre";
}

</script>

</body>
  </html>
