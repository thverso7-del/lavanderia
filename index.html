<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavanderia Limpa+</title>

<style>

body{
font-family:Arial;
margin:0;
text-align:center;
background:#f2f2f2;
}

header{
background:#0b3d91;
color:white;
padding:25px;
}

.logo{
font-size:30px;
font-weight:bold;
}

.hero{
padding:80px;
}

.botao{
background:#1e90ff;
color:white;
padding:15px 40px;
font-size:20px;

border-radius:8px;
}

.counter{
background:#0b3d91;

}

</style>
</head>

<body>

<header>
<div class="logo">Lavanderia Limpa+</div>

</header>

<div class="hero">
<h2>Bem-vindo</h2>
<p>Use nossas máquinas automáticas</p>

<br>

<a class="botao" href="maquinas.html">INICIAR</a>

</div>

<div class="counter">
Clientes atendidos: <span id="contador">0</span>
</div>

<script>

let contador=0;

function aumentar(){
contador++
document.getElementById("contador").innerText=contador
}

setInterval(aumentar,1000)

</script>
