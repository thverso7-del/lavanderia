<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lavanderia</title>

<style>

body{
font-family:Arial;
background:#1f84c6;
text-align:center;
color:white;
}

h1{
font-size:80px;
margin-top:20px;
}

.container{
display:flex;
justify-content:center;
gap:60px;
margin-top:40px;
flex-wrap:wrap;
}

.maquina{
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
}
}

.maquina img{
width:220px;
}

.status{
font-size:22px;
margin-bottom:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
margin:5px;
font-size:16px;
cursor:pointer;
}

.lavar{
background:#ff5b5b;
color:white;
}

.parar{
background:#2ecc71;
color:white;
}

</style>
</head>

<body>

<h1>Lavadoras</h1>

<div class="container">

<div class="maquina">
<div class="status" id="lav1">🟢 Livre</div>
<img src="uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('lav1',33)">Iniciar</button>
</div>

<div class="maquina">
<div class="status" id="lav2">🟢 Livre</div>
<img  src="uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('lav2',33)">Iniciar</button>
</div>

<div class="maquina">
<div class="status" id="lav3">🟢 Livre</div>
<img src="uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('lav3',33)">Iniciar</button>
</div>

</div>


<h1>Secadoras</h1>

<div class="container">

<div class="maquina">
<div class="status" id="sec1">🟢 Livre</div>
<img src="uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('sec1',40)">Iniciar</button>
</div>

<div class="maquina">
<div class="status" id="sec2">🟢 Livre</div>
<img src="uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('sec2',40)">Iniciar</button>
</div>

<div class="maquina">
<div class="status" id="sec3">🟢 Livre</div>
<img src=" uma-maquina-de-lavar-isolada-em-fundo-branco_1308-61579.jpg" width="200">
<br>
<button class="lavar" onclick="iniciar('sec3',40)">Iniciar</button>
</div>

</div>

<script>
async function iniciar(id, minutos){

let tempoFim = Date.now() + minutos * 60000

await supabase
.from("maquinas")
.update({
status: "ocupado",
tempo_fin: tempoFim
})
.eq("nome", id)

}
</script>

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabaseUrl = "https://fagjvpxjlwgnyzdsusmm.supabase.co"
const supabaseKey = "sb_publishable_pAFXkmJb4hlNOCeADFVXWw_7_BHMDlk"

 const supabase = supabase.createClient(supabaseUrl, supabaseKey)
  <script>
supabase
.channel("tempo-maquinas")
.on(
"postgres_changes",
{ event: "*", schema: "public", table: "maquinas" },
(payload) => {
location.reload()
}
)
.subscribe()
</script>
</script>
</body>
</html>
