<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lavanderia Limpa+</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

/* TELAS */

.tela{
display:none;
padding:25px;
}

.ativa{
display:block;
}

/* LOGO */

.logo{
text-align:center;
margin-top:60px;
}

.logo-icon{
width:80px;
height:80px;
border-radius:50%;
border:6px solid #00a86b;
margin:auto;
position:relative;
}

.logo-icon:after{
content:"+";
position:absolute;
font-size:40px;
color:#00a86b;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-weight:bold;
}

.logo h1{
color:#00a86b;
margin-top:10px;
}

/* TEXTOS */

.sub{
text-align:center;
color:#444;
margin-bottom:40px;
}

.titulo{
font-size:28px;
font-weight:bold;
margin-bottom:5px;
}

.subtitulo{
color:#666;
margin-bottom:25px;
}

/* BOTÕES */

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
}

.btn-primary{
background:#00a86b;
color:white;
}

.btn-secondary{
background:#eaeaea;
}

/* INPUTS */

input{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #ccc;
margin-top:8px;
margin-bottom:15px;
font-size:15px;
}

label{
font-weight:bold;
}

.voltar{
font-size:20px;
cursor:pointer;
margin-bottom:20px;
display:inline-block;
}

/* TELA DAS MÁQUINAS */

.maquinas{
display:grid;
grid-template-columns:1fr 1fr 1fr 1fr;
gap:15px;
margin-top:30px;
}

.maquina{
background:white;
border-radius:10px;
padding:15px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.maquina img{
width:60px;
}

.maquina p{
margin:8px 0 0 0;
font-size:14px;
}

</style>

<script>

function mostrarTela(id){

document.querySelectorAll(".tela").forEach(t=>{
t.classList.remove("ativa")
})

document.getElementById(id).classList.add("ativa")

}

/* CADASTRO */

function criarConta(){

let nome = document.getElementById("nome").value
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value

if(nome=="" || email=="" || senha==""){
alert("Preencha todos os campos")
return
}

alert("Conta criada com sucesso!")

mostrarTela("maquinas")

}

/* LOGIN */

function entrar(){

mostrarTela("maquinas")

}

</script>

</head>

<body>

<!-- TELA INICIAL -->

<div id="inicio" class="tela ativa">

<div class="logo">
<div class="logo-icon"></div>
<h1>Lavanderia Limpa+</h1>
</div>

<p class="sub">A lavanderia inteligente da sua cidade</p>

<button class="btn-primary" onclick="mostrarTela('login')">
Entrar na minha conta
</button>

<button class="btn-secondary" onclick="mostrarTela('cadastro')">
Criar conta
</button>

</div>

<!-- CADASTRO -->

<div id="cadastro" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<div class="titulo">Vamos fazer seu cadastro</div>
<div class="subtitulo">Preencha os dados abaixo</div>

<label>Nome</label>
<input id="nome" type="text" placeholder="Ana">

<label>Sobrenome</label>
<input type="text" placeholder="Silva">

<label>CPF</label>
<input type="text" placeholder="000.000.000-00">

<label>Data de nascimento</label>
<input type="text" placeholder="01/01/2000">

<label>CEP</label>
<input type="text" placeholder="00000-000">

<label>Email</label>
<input id="email" type="email" placeholder="email@email.com">

<label>Senha</label>
<input id="senha" type="password" placeholder="******">

<button class="btn-primary" onclick="criarConta()">
Criar conta
</button>

</div>

<!-- LOGIN -->

<div id="login" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<div class="titulo">Bem-vindo de volta!</div>
<div class="subtitulo">Informe seu e-mail e senha</div>

<label>Email</label>
<input type="email" placeholder="seu@email.com">

<label>Senha</label>
<input type="password" placeholder="******">

<button class="btn-primary" onclick="entrar()">
Entrar
</button>

</div>

<!-- TELA OFICIAL -->

<div id="maquinas" class="tela">

<h2>Escolha uma máquina</h2>

<div class="maquinas">

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 1</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 2</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 3</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 4</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 5</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 6</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 7</p>
</div>

<div class="maquina">
<img src="uma-maquina-de-lavar-branca-com-frente-e-traseira-preta-e-prateada_481747-98173.jpg">
<p>Máquina 8</p>
</div>

</div>

</div>

</body>
  </html>
