<!DOCTYPE html>
<html>
<head>
<title>Lavanderia Compartilhada</title>

<style>

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#1e3c72,#2a5298);
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
}

h1{
  font-size:40px;
  margin-bottom:5px;
}

.subtitulo{
  font-size:18px;
  margin-bottom:40px;
}

.caixa{
  background:white;
  width:300px;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  color:#333;
}

.status{
  font-size:20px;
  margin:20px 0;
}

button{
  padding:12px 20px;
  font-size:15px;
  border:none;
  border-radius:25px;
  margin:5px;
  cursor:pointer;
}

.lavar{
  background:#ff5e5e;
  color:white;
}

.livre{
  background:#2ecc71;
  color:white;
}
</style>

</head>

<body>

<h1>Lavanderia Compartilhada</h1>

<p class="subtitulo">Sistema de controle das lavadoras</p>

<div class="caixa">

<h2>Lavadora 1</h2>

<p id="maq1" class="status">🟢 Livre</p>

<button class="lavar" onclick="lavando()">Começar lavagem</button>

<button class="livre" onclick="livre()">Terminou</button>

</div>

<script>

function lavando(){
document.getElementById("maq1").innerHTML="🔴 Lavando";
}

function livre(){
document.getElementById("maq1").innerHTML="🟢 Livre";
}

</script>

</body>
</html>
