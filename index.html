<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lavanderia Limpa+</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

.tela{
display:none;
padding:20px;
}

.ativa{
display:block;
}

/* LOGO */

.logo{
text-align:center;
margin-top:60px;
}

.logo-icon{
width:80px;
height:80px;
border-radius:50%;
border:6px solid #00a86b;
margin:auto;
position:relative;
}

.logo-icon:after{
content:"+";
position:absolute;
font-size:40px;
color:#00a86b;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-weight:bold;
}

.logo h1{
color:#00a86b;
}

.sub{
text-align:center;
color:#444;
margin-bottom:40px;
}

/* BOTÕES */

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
}

.btn-primary{
background:#00a86b;
color:white;
}

.btn-secondary{
background:#eaeaea;
}

/* INPUTS */

input{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #ccc;
margin-top:8px;
margin-bottom:15px;
}

label{
font-weight:bold;
}

.voltar{
font-size:22px;
cursor:pointer;
margin-bottom:20px;
}

/* TOPO APP */

.topo{
background:#0c8f4c;
color:white;
padding:20px;
border-radius:0 0 20px 20px;
}

.logo-topo{
background:white;
color:black;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold;
margin-bottom:15px;
}

.info-topo{
display:flex;
justify-content:space-between;
align-items:center;
}

.saldo{
background:white;
color:black;
padding:8px 15px;
border-radius:10px;
font-weight:bold;
}

/* MAQUINAS */

.conteudo{
padding:20px;
}

.grid-maquinas{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:30px;
}

.maq{
background:white;
height:70px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.maq img{
width:45px;
}

/* MENU */

.menu{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -2px 6px rgba(0,0,0,0.1);
text-align:center;
font-size:14px;
}

</style>

<script>

function mostrarTela(id){

document.querySelectorAll(".tela").forEach(t=>{
t.classList.remove("ativa")
})

document.getElementById(id).classList.add("ativa")

}

function criarConta(){

let nome = document.getElementById("nome").value
let email = document.getElementById("email").value
let senha = document.getElementById("senha").value

if(nome=="" || email=="" || senha==""){
alert("Preencha todos os campos")
return
}

alert("Conta criada com sucesso!")

mostrarTela("maquinas")

}

function entrar(){
mostrarTela("maquinas")
}

</script>

</head>

<body>

<!-- TELA INICIAL -->

<div id="inicio" class="tela ativa">

<div class="logo">
<div class="logo-icon"></div>
<h1>Lavanderia Limpa+</h1>
</div>

<p class="sub">A lavanderia inteligente da sua cidade</p>

<button class="btn-primary" onclick="mostrarTela('login')">
Entrar na minha conta
</button>

<button class="btn-secondary" onclick="mostrarTela('cadastro')">
Criar conta
</button>

</div>

<!-- CADASTRO -->

<div id="cadastro" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<h2>Vamos fazer seu cadastro</h2>

<label>Nome</label>
<input id="nome" type="text" placeholder="Ana">

<label>Sobrenome</label>
<input type="text">

<label>CPF</label>
<input type="text">

<label>Data de nascimento</label>
<input type="text">

<label>CEP</label>
<input type="text">

<label>Email</label>
<input id="email" type="email">

<label>Senha</label>
<input id="senha" type="password">

<button class="btn-primary" onclick="criarConta()">
Criar conta
</button>

</div>

<!-- LOGIN -->

<div id="login" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<h2>Bem-vindo de volta</h2>

<label>Email</label>
<input type="email">

<label>Senha</label>
<input type="password">

<button class="btn-primary" onclick="entrar()">
Entrar
</button>

</div>

<!-- TELA OFICIAL -->

<div id="maquinas" class="tela">

<div class="topo">

<div class="logo-topo">
🧼 Lavanderia Limpa+
</div>

<div class="info-topo">

<div>
<small>sexta-feira</small>
<h2>Olá, Matheus</h2>
</div>

<div class="saldo">
R$ 0,00
</div>

</div>

</div>

<div class="conteudo">

<h3>Secadoras:</h3>

<div class="grid-maquinas">

<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>

</div>

<h3>Lavadoras:</h3>

<div class="grid-maquinas">

<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>
<div class="maq"><img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png"></div>

</div>

</div>

<div class="menu">

<div>🏠<br>Início</div>
<div>💰<br>Carteira</div>
<div>⏰<br>Horário</div>
<div>☰<br>Menu</div>

</div>

</div>

</body>
</html>
