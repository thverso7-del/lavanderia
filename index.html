<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lavanderia Limpa+</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f5f5;
}

.tela{
display:none;
padding:25px;
}

.ativa{
display:block;
}

.logo{
text-align:center;
margin-top:60px;
}

.logo-icon{
width:80px;
height:80px;
border-radius:50%;
border:6px solid #00a86b;
margin:auto;
position:relative;
}

.logo-icon:after{
content:"+";
position:absolute;
font-size:40px;
color:#00a86b;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-weight:bold;
}

.logo h1{
color:#00a86b;
margin-top:10px;
}

.sub{
text-align:center;
color:#444;
margin-bottom:40px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
margin-top:10px;
}

.btn-primary{
background:#00a86b;
color:white;
}

.btn-secondary{
background:#eaeaea;
}

input{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #ccc;
margin-top:8px;
margin-bottom:15px;
font-size:15px;
}

label{
font-weight:bold;
color:#333;
}

.titulo{
font-size:28px;
font-weight:bold;
margin-bottom:5px;
}

.subtitulo{
color:#666;
margin-bottom:25px;
}

.voltar{
font-size:20px;
cursor:pointer;
margin-bottom:20px;
display:inline-block;
}

</style>

<script>

function mostrarTela(id){

document.querySelectorAll(".tela").forEach(t=>{
t.classList.remove("ativa")
})

document.getElementById(id).classList.add("ativa")

}

</script>

</head>

<body>

<!-- TELA INICIAL -->

<div id="inicio" class="tela ativa">

<div class="logo">
<div class="logo-icon"></div>
<h1>Lavanderia Limpa+</h1>
</div>

<p class="sub">A lavanderia inteligente da sua cidade</p>

<button class="btn-primary" onclick="mostrarTela('login')">
Entrar na minha conta
</button>

<button class="btn-secondary" onclick="mostrarTela('cadastro')">
Criar conta
</button>

</div>



<!-- TELA CADASTRO -->

<div id="cadastro" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<div class="titulo">Vamos fazer seu cadastro</div>

<div class="subtitulo">
Preencha os dados abaixo para criar sua conta
</div>

<label>Nome</label>
<input type="text" placeholder="Ana">

<label>Sobrenome</label>
<input type="text" placeholder="Silva">

<label>CPF</label>
<input type="text" placeholder="000.000.000-00">

<label>Data de nascimento</label>
<input type="text" placeholder="01/01/2000">

<label>CEP</label>
<input type="text" placeholder="00000-000">

<label>Email</label>
<input type="email" placeholder="email@email.com">

<label>Senha</label>
<input type="password" placeholder="******">

<button class="btn-primary">
Criar conta
</button>

</div>



<!-- TELA LOGIN -->

<div id="login" class="tela">

<div class="voltar" onclick="mostrarTela('inicio')">←</div>

<div class="titulo">Bem-vindo de volta!</div>

<div class="subtitulo">
Informe seu e-mail e senha para acessar sua conta
</div>

<label>Nome de usuário</label>
<input type="email" placeholder="seu@email.com">

<label>Senha</label>
<input type="password" placeholder="******">

<p style="font-size:14px;color:#666">
Esqueceu sua senha?
</p>

<button class="btn-primary">
Entrar
</button>

</div>


</body>
</html>
